- name: openrouter
  type: group
  fields:
    - name: usage
      type: group
      description: OpenRouter daily usage analytics bucket fields.
      fields:
        - name: model
          type: keyword
          description: LLM model identifier (e.g. openai/gpt-4o).
        - name: provider
          type: keyword
          description: Provider routing the request (e.g. OpenAI, Anthropic).
        - name: variant
          type: keyword
          description: Model variant identifier when grouped by variant.
        - name: api_key_id
          type: keyword
          description: API key identifier when grouped by api_key_id.
        - name: workspace
          type: keyword
          description: Workspace identifier when grouped by workspace.
        - name: app
          type: keyword
          description: Application identifier when grouped by app.
        - name: user
          type: keyword
          description: User identifier when grouped by user.
        - name: request_count
          type: long
          description: Number of API requests in the period.
          metric_type: counter
        - name: tokens_prompt
          type: long
          description: Input/prompt tokens consumed in the period.
          metric_type: counter
        - name: tokens_completion
          type: long
          description: Completion tokens generated in the period.
          metric_type: counter
        - name: tokens_total
          type: long
          description: Total tokens (prompt + completion) in the period.
          metric_type: counter
        - name: cached_tokens
          type: long
          description: Tokens served from cache in the period.
          metric_type: counter
        - name: reasoning_tokens
          type: long
          description: Reasoning tokens consumed (for models that expose them).
          metric_type: counter
        - name: guardrail_invoked_count
          type: long
          description: Number of guardrail invocations in the period.
          metric_type: counter
        - name: total_usage
          type: double
          description: Total cost in USD credits consumed in the period.
          metric_type: gauge
        - name: credits_usage
          type: double
          description: Billable credits consumed (may differ from total_usage when BYOK).
          metric_type: gauge
        - name: openrouter_usage
          type: double
          description: OpenRouter routing fee component of total_usage.
          metric_type: gauge
