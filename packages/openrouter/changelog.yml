- version: "0.1.0"
  changes:
    - description: >-
        Initial release. Collect daily usage metrics (request count, token consumption, cost)
        and hourly performance metrics (latency percentiles, throughput, cache hit rate)
        from the OpenRouter Analytics API. Two data streams: usage (granularity: day)
        and performance (granularity: hour), both supporting model and provider dimensions.
        Windowed collection with cursor-based backfill handles the 31-day per-query span
        limit transparently. Includes alerting rule templates for cost anomalies,
        cache hit rate drops, and provider latency regressions.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/21500
