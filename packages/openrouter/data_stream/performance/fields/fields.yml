- name: openrouter
  type: group
  fields:
    - name: performance
      type: group
      description: OpenRouter hourly performance analytics bucket fields.
      fields:
        - name: model
          type: keyword
          description: LLM model identifier (e.g. openai/gpt-4o).
        - name: provider
          type: keyword
          description: Provider routing the request (e.g. OpenAI, Anthropic).
        - name: variant
          type: keyword
          description: Model variant identifier when grouped by variant.
        - name: api_key_id
          type: keyword
          description: API key identifier when grouped by api_key_id.
        - name: workspace
          type: keyword
          description: Workspace identifier when grouped by workspace.
        - name: p50_latency
          type: double
          description: >-
            50th-percentile end-to-end request latency in milliseconds.
            This is a rate metric — do not sum across time windows.
          unit: ms
          metric_type: gauge
        - name: p90_latency
          type: double
          description: >-
            90th-percentile end-to-end request latency in milliseconds.
            This is a rate metric — do not sum across time windows.
          unit: ms
          metric_type: gauge
        - name: p99_latency
          type: double
          description: >-
            99th-percentile end-to-end request latency in milliseconds.
            This is a rate metric — do not sum across time windows.
          unit: ms
          metric_type: gauge
        - name: p50_ttfb
          type: double
          description: >-
            50th-percentile time-to-first-token (TTFT) in milliseconds.
            This is a rate metric — do not sum across time windows.
          unit: ms
          metric_type: gauge
        - name: p99_ttfb
          type: double
          description: >-
            99th-percentile time-to-first-token (TTFT) in milliseconds.
            This is a rate metric — do not sum across time windows.
          unit: ms
          metric_type: gauge
        - name: p50_throughput
          type: double
          description: >-
            50th-percentile streaming throughput in tokens per second.
            This is a rate metric — do not sum across time windows.
          metric_type: gauge
        - name: p99_throughput
          type: double
          description: >-
            99th-percentile streaming throughput in tokens per second.
            This is a rate metric — do not sum across time windows.
          metric_type: gauge
        - name: cache_hit_rate
          type: double
          description: >-
            Fraction of requests that were served from prompt cache (0.0–1.0).
            This is a rate metric — do not sum across time windows.
          unit: percent
          metric_type: gauge
        - name: guardrail_invoked_rate
          type: double
          description: >-
            Fraction of requests for which a guardrail was invoked (0.0–1.0).
            This is a rate metric — do not sum across time windows.
          unit: percent
          metric_type: gauge
        - name: response_cached_rate
          type: double
          description: >-
            Fraction of responses that were cached (0.0–1.0).
            This is a rate metric — do not sum across time windows.
          unit: percent
          metric_type: gauge
